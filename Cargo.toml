[package]
name = "lunar"
version = "0.1.0"
edition = "2024"
description = "A terminal coding harness"
license = "MIT"
repository = "https://github.com/gszr/lunar"
readme = "README.md"

[dependencies]
mlua = { version = "0.12", features = ["lua55", "vendored"] }
pulldown-cmark = "0.13"
ratatui = "0.30"
serde_json = "1.0.151"
ureq = "3"
webbrowser = "1"
