<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 626" role="img" aria-label="Lunar logo">
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f9f8ff"/>
      <stop offset="1" stop-color="#efedfc"/>
    </linearGradient>
    <linearGradient id="moon-shade" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#dfddfa"/>
      <stop offset="1" stop-color="#d1cff7"/>
    </linearGradient>
    <linearGradient id="crater" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#bdbbef"/>
      <stop offset="1" stop-color="#cac8f3"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#aeacf5"/>
      <stop offset="1" stop-color="#c5c3ff"/>
    </linearGradient>
    <radialGradient id="satellite" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#aaa8f8"/>
      <stop offset="1" stop-color="#8582d9"/>
