    </clipPath>
    <mask id="orbit-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="624" height="626">
      <rect width="624" height="626" fill="white"/>
      <circle cx="531" cy="109" r="72" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#orbit-cutout)">
