    <path d="M370 75C346 68 320 65 295 68C166 75 61 185 61 313C57 450 165 559 295 559C382 563 458 517 499 443C455 480 407 490 354 484C251 477 174 389 174 283C174 177 258 78 370 75Z" fill="url(#moon)"/>
    <g clip-path="url(#crescent)">
