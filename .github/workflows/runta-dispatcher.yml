name: Runta dispatcher

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: runta-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: gszr/actions/runta-dispatch@v1
        with:
          runtime: lunar-agent
          model: ${{ vars.RUNTA_MODEL }}
          base_url: ${{ vars.RUNTA_BASE_URL }}
          provider_secret: ${{ vars.RUNTA_PROVIDER_SECRET }}
          gh_token: ${{ github.token }}
        env:
          RUNTA_TOKEN: ${{ secrets.RUNTA_TOKEN }}
